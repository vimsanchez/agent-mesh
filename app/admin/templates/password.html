{% extends "base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block body %}
<h1>Cambia tu contraseña</h1>
<p class="lead">
  Tu contraseña actual se imprimió en el log de arranque del contenedor.
  Cualquiera que pueda leer ese log la conoce, así que hay que reemplazarla antes
  de seguir.
</p>
<div class="panel" style="max-width: 24rem">
  <form method="post" action="/admin/password">
    <div style="margin-bottom:.9rem">
      <label for="password">Contraseña nueva (mínimo 12 caracteres)</label>
      <input id="password" name="password" type="password" required autofocus
             minlength="12" autocomplete="new-password">
    </div>
    <div style="margin-bottom:1.1rem">
      <label for="repeat">Repítela</label>
      <input id="repeat" name="repeat" type="password" required autocomplete="new-password">
    </div>
    <button type="submit">Guardar</button>
  </form>
</div>
{% endblock %}
