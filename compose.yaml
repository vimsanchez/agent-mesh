# Compatible con Docker Compose y con Podman Compose:
# sin `depends_on: condition`, sin bind-mounts de código, volumen nombrado.
services:
  mesh:
    build: .
    env_file: .env
    environment:
      # La ruta dentro del contenedor manda sobre lo que diga .env.
      DATABASE_URL: sqlite:////data/mesh.db
      # Hora local del contenedor (logs, `date`). Los timestamps de la API y
      # de la base siguen en UTC a propósito: son la referencia común entre
      # máquinas de personas distintas.
      TZ: America/Mexico_City
    volumes:
      - mesh-data:/data
    ports:
      # SOLO loopback. SPEC.md §9: el túnel de Cloudflare debe ser el único
      # camino de entrada. Publicar "8840:8000" lo expondría a la LAN y dejaría
      # el panel accesible sin pasar por el túnel.
      - "127.0.0.1:8840:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/healthz").status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mesh-data:
