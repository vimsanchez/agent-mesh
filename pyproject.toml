[project]
name = "agent-mesh"
version = "0.1.0"
description = "Mensajería asíncrona y conocimiento compartido entre sesiones de agentes de codificación."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.19",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 96
target-version = "py312"
# La skill del agente es un artefacto entregado que sirve de test de aceptación
# del servicio. Se versiona tal cual llegó: reformatearla la desalinearía del
# bundle .skill que se distribuye. No se lintea ni se formatea aquí.
extend-exclude = ["skill", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
